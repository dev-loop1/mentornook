name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ts

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: mentornook
          POSTGRES_PASSWORD: mentornook_password
          POSTGRES_DB: mentornook_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: backend-ts/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Generate Prisma Client
      run: npx prisma generate

    - name: Run Prisma Migration Check
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://mentornook:mentornook_password@localhost:5432/mentornook_test_db?schema=public

    - name: Run Linter
      run: npm run lint

    - name: Type Check
      run: npx tsc --noEmit

    - name: Run Tests
      run: npm test
      env:
        DATABASE_URL: postgresql://mentornook:mentornook_password@localhost:5432/mentornook_test_db?schema=public
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Build Docker Image
      run: docker build -t mentornook-api:test .
